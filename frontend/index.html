<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a14" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322d3ee'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2303131a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2303131a'/%3E%3C/svg%3E" />
    <title>Disaster Response</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
